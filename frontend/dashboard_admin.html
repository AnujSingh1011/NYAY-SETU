<!DOCTYPE html>
<html lang="en">
<head>
  <title>Admin Dashboard</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar"><h4>Admin Panel</h4><a class="active" href="/dashboard_admin.html">Analytics</a><a href="#" id="openStationModal">Add Station</a><a href="#" id="logoutBtn">Logout</a></aside>
  <main class="dashboard-content">
    <h2>System Analytics</h2>
    <div class="kpi-grid mb-3"><div class="stat-card"><h2 id="admUsers">0</h2><p>Users</p></div><div class="stat-card"><h2 id="admFirs">0</h2><p>FIRs</p></div><div class="stat-card"><h2 id="admOfficers">0</h2><p>Officers</p></div><div class="stat-card"><h2 id="admStations">0</h2><p>Stations</p></div></div>
    <div class="row g-3"><div class="col-lg-6"><div class="table-card p-3"><h5>User Management</h5><ul class="list-group" id="adminUserList"></ul></div></div><div class="col-lg-6"><div class="table-card p-3"><h5>System Logs</h5><ul class="list-group" id="adminLogList"></ul></div></div></div>
  </main>
</div>
<div class="custom-modal" id="stationModal"><div class="custom-modal-body"><div class="d-flex justify-content-between"><h5>Create Police Station</h5><button class="btn btn-sm btn-outline-secondary" data-close-modal="stationModal">×</button></div>
<form id="stationForm" class="row g-2 mt-1"><div class="col-md-6"><label class="form-label">State</label><select class="form-select" id="stateSelect" required></select></div><div class="col-md-6"><label class="form-label">District</label><select class="form-select" id="districtSelect" required></select></div><div class="col-12"><label class="form-label">Station Name</label><input class="form-control" id="stationName" required></div><div class="col-12"><label class="form-label">Generated Station ID</label><input class="form-control" id="stationId" readonly></div><div class="col-12"><button class="btn btn-primary" type="submit">Create Station</button></div></form>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.APP_CONFIG={API_BASE_URL:'http://localhost:8000/api',GOOGLE_MAPS_API_KEY:''};</script>
<script src="/js/api-service.js"></script>
<script src="/js/station_hierarchy.js"></script>
<script>
new SessionManager().start();
logoutBtn.onclick=(e)=>{e.preventDefault();AuthManager.logout();};
stationHierarchy.bindStateDistrict('stateSelect','districtSelect');
stateSelect.onchange=()=>stationId.value='';
districtSelect.onchange=()=>{if(stateSelect.value&&districtSelect.value)stationId.value=stationHierarchy.generateStationId(stateSelect.value,districtSelect.value);};
openStationModal.onclick=(e)=>{e.preventDefault();UIUtils.openModal('stationModal');};
stationForm.addEventListener('submit',async(e)=>{
  e.preventDefault();
  if(!stationId.value) stationId.value=stationHierarchy.generateStationId(stateSelect.value,districtSelect.value);
  await apiService.createStation({state:stateSelect.value,district:districtSelect.value,name:stationName.value,stationId:stationId.value});
  UIUtils.closeModal('stationModal');
  UIUtils.toast('Station created');
  stationForm.reset();
  render();
});
async function render(){
  const db=apiService.mockDb;
  admUsers.textContent=db.users.length;admFirs.textContent=db.firs.length;admOfficers.textContent=db.officers.length;admStations.textContent=db.stations.length;
  adminUserList.innerHTML=db.users.map(u=>`<li class='list-group-item'>${u.name} <span class='badge bg-secondary'>${u.role}</span></li>`).join('');
  const logs=(await apiService.getActivityLogs()).logs;
  adminLogList.innerHTML=logs.slice(-10).reverse().map(l=>`<li class='list-group-item'><small>${new Date(l.at).toLocaleString()}</small><br>${l.action}</li>`).join('');
}
render();
</script>
</body>
</html>
