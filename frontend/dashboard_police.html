<!DOCTYPE html>
<html lang="en">
<head>
  <title>Police Dashboard</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar"><h4>Police Officer</h4><a class="active" href="/dashboard_police.html">Assigned Cases</a><a href="/track_fir.html">Track FIR</a><a href="#" id="logoutBtn">Logout</a></aside>
  <main class="dashboard-content">
    <h2>Assigned Cases</h2>
    <select class="form-select w-auto mb-3" id="priorityFilter"><option value="">All Priority</option><option>High</option><option>Medium</option><option>Low</option></select>
    <ul class="list-group" id="policeCaseList"></ul>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.APP_CONFIG={API_BASE_URL:'http://localhost:8000/api',GOOGLE_MAPS_API_KEY:''};</script>
<script src="/js/api-service.js"></script>
<script>
new SessionManager().start();
logoutBtn.onclick=(e)=>{e.preventDefault();AuthManager.logout();};
async function paint(){
  const {firs}=await apiService.getFIRs();
  const p=priorityFilter.value;
  const list=firs.filter(f=>!p||f.priority===p);
  policeCaseList.innerHTML=list.map(f=>`<li class='list-group-item'><div class='d-flex justify-content-between'><strong>${f.id} - ${f.title}</strong><span class='pill ${f.priority.toLowerCase()}'>${f.priority}</span></div><div class='d-flex gap-2 mt-2'><select class='form-select form-select-sm w-auto' data-id='${f.id}'><option>Filed</option><option ${f.status==='Under Investigation'?'selected':''}>Under Investigation</option><option>Resolved</option></select><button class='btn btn-sm btn-primary' data-act='save' data-id='${f.id}'>Update</button></div></li>`).join('');
  document.querySelectorAll("button[data-act='save']").forEach(btn=>btn.onclick=async()=>{
    const id=btn.dataset.id;
    const s=document.querySelector(`select[data-id='${id}']`).value;
    await apiService.updateFIRStatus(id,s);
    UIUtils.toast('Status updated');
  });
}
priorityFilter.onchange=paint;paint();
</script>
</body>
</html>
