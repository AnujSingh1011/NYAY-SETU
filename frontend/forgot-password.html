<!DOCTYPE html>
<html lang="en">
<head>
  <title>Forgot Password - Nyay Setu</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg main-nav"><div class="container"><a class="navbar-brand fw-bold" href="/index.html">Nyay Setu</a></div></nav>
<main class="auth-wrapper">
  <div class="auth-card">
    <h2>Reset Password</h2>
    <div class="mb-3"><span class="step-pill active" id="fp1">1</span> <span class="step-pill" id="fp2">2</span> <span class="step-pill" id="fp3">3</span></div>
    <form id="fpForm" class="row g-3">
      <div class="fp-pane col-12" data-step="1">
        <label class="form-label">Registered Email</label><input class="form-control" name="email" type="email" required>
        <button class="btn btn-primary mt-3" type="button" id="fpNext1">Send OTP</button>
      </div>
      <div class="fp-pane col-12 d-none" data-step="2">
        <label class="form-label">OTP</label><input class="form-control" name="otp" maxlength="6" required>
        <button class="btn btn-outline-primary mt-3" type="button" id="fpBack1">Back</button>
        <button class="btn btn-primary mt-3" type="button" id="fpNext2">Verify OTP</button>
      </div>
      <div class="fp-pane col-12 d-none" data-step="3">
        <label class="form-label">New Password</label><input class="form-control" name="newPassword" type="password" required>
        <label class="form-label mt-2">Confirm Password</label><input class="form-control" name="confirmPassword" type="password" required>
        <button class="btn btn-outline-primary mt-3" type="button" id="fpBack2">Back</button>
        <button class="btn btn-primary mt-3" type="submit">Reset Password</button>
      </div>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.APP_CONFIG={API_BASE_URL:'http://localhost:8000/api',GOOGLE_MAPS_API_KEY:''};</script>
<script src="/js/api-service.js"></script>
<script>
const panes=[...document.querySelectorAll('.fp-pane')];
const pills=[fp1,fp2,fp3];
const show=(n)=>{panes.forEach((p,i)=>p.classList.toggle('d-none',i!==n-1));pills.forEach((p,i)=>p.classList.toggle('active',i===n-1));};
fpNext1.onclick=async()=>{ if(!FormValidator.validateEmail(fpForm.email.value)) return UIUtils.toast('Enter valid email','warning'); await apiService.forgotPassword(fpForm.email.value); UIUtils.toast('OTP sent (mock: 123456)'); show(2); };
fpBack1.onclick=()=>show(1);
fpNext2.onclick=()=>{ if(!/^\d{6}$/.test(fpForm.otp.value||'')) return UIUtils.toast('Invalid OTP','warning'); show(3); };
fpBack2.onclick=()=>show(2);
fpForm.addEventListener('submit',async(e)=>{ e.preventDefault(); if(!FormValidator.validatePassword(fpForm.newPassword.value)) return UIUtils.toast('Use strong password','warning'); if(fpForm.newPassword.value!==fpForm.confirmPassword.value) return UIUtils.toast('Passwords mismatch','warning'); await apiService.resetPassword({}); UIUtils.toast('Password reset successful'); setTimeout(()=>location.href='/login.html',700);});
</script>
</body>
</html>
