<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - Nyay Setu</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' http://localhost:8000; frame-ancestors 'none';" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg main-nav"><div class="container"><a class="navbar-brand fw-bold" href="/index.html">Nyay Setu</a></div></nav>
<main class="auth-wrapper">
  <div class="auth-card">
    <h2 class="mb-3">Login</h2>
    <ul class="nav nav-pills role-tabs mb-3" id="roleTabs">
      <li class="nav-item"><button type="button" class="nav-link active" data-role="citizen">Citizen</button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-role="police">Police Officer</button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-role="senior">Senior Officer</button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-role="admin">Admin</button></li>
    </ul>
    <form id="loginForm" class="row g-3">
      <div class="col-12"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div>
      <div class="col-12 d-none" id="officerField"><label class="form-label">Officer/Admin ID</label><input class="form-control" name="officerId"></div>
      <div class="col-12"><label class="form-label">Password</label><input class="form-control" name="password" type="password" required></div>
      <div class="col-12 d-flex justify-content-between"><a href="/forgot-password.html">Forgot password?</a><a href="/register.html">Create account</a></div>
      <div class="col-12"><button class="btn btn-primary w-100" type="submit">Login</button></div>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.APP_CONFIG={API_BASE_URL:'http://localhost:8000/api',GOOGLE_MAPS_API_KEY:''};</script>
<script src="/js/api-service.js"></script>
<script>
let currentRole='citizen';
document.querySelectorAll('#roleTabs .nav-link').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('#roleTabs .nav-link').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentRole=btn.dataset.role;
  document.getElementById('officerField').classList.toggle('d-none',!['police','senior','admin'].includes(currentRole));
}));
document.getElementById('loginForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const data=Object.fromEntries(new FormData(e.target).entries());
  if(!FormValidator.validateEmail(data.email)) return UIUtils.toast('Enter valid email','warning');
  if(['police','senior','admin'].includes(currentRole) && !data.officerId) return UIUtils.toast('ID required','warning');
  const resp=await apiService.login({...data,role:currentRole});
  AuthManager.setSession(resp);
  const redirect={citizen:'/dashboard_citizen.html',police:'/dashboard_police.html',senior:'/dashboard_senior.html',admin:'/dashboard_admin.html'};
  window.location.href=redirect[currentRole];
});
</script>
</body>
</html>
