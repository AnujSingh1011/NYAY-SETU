<!DOCTYPE html>
<html lang="en">
<head>
  <title>Station Incharge Dashboard</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar"><h4>Station Incharge</h4><a class="active" href="/pages/dashboard_station_incharge.html">Overview</a><a href="/dashboard_police.html">Officer Dashboard</a><a href="#" id="logoutBtn">Logout</a></aside>
  <main class="dashboard-content">
    <h2>Station Operations</h2>
    <div class="row g-3">
      <div class="col-lg-4"><div class="table-card p-3"><h5>Officer Management</h5><ul class="list-group" id="stationOfficerList"></ul></div></div>
      <div class="col-lg-4"><div class="table-card p-3"><h5>Case Assignment</h5><select class="form-select mb-2" id="assignFirId"><option value="">Select FIR</option><option>FIR-2026-0101</option><option>FIR-2026-0102</option></select><select class="form-select mb-2" id="assignOfficerId"><option value="">Select Officer</option><option>OFF-201</option><option>OFF-202</option><option>OFF-203</option></select><button class="btn btn-primary w-100" id="assignCaseBtn">Assign Case</button><ul class="list-group mt-3" id="stationFirList"></ul></div></div>
      <div class="col-lg-4"><div class="table-card p-3"><h5>Complaint Response</h5><ul class="list-group" id="stationComplaintList"></ul></div></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.APP_CONFIG={API_BASE_URL:'http://localhost:8000/api',GOOGLE_MAPS_API_KEY:''};</script>
<script src="/js/api-service.js"></script>
<script src="/js/station_dashboard.js"></script>
<script>
new SessionManager().start();
logoutBtn.onclick=(e)=>{e.preventDefault();AuthManager.logout();};
stationDashboard.initialize();
</script>
</body>
</html>
