<!DOCTYPE html>
<html lang="en">
<head>
  <title>Register - Nyay Setu</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg main-nav"><div class="container"><a class="navbar-brand fw-bold" href="/index.html">Nyay Setu</a></div></nav>
<main class="auth-wrapper">
  <div class="auth-card">
    <h2>Citizen Registration</h2>
    <div class="mb-3"><span class="step-pill active" id="s1">1</span> <span class="step-pill" id="s2">2</span> <span class="step-pill" id="s3">3</span></div>
    <form id="regForm" class="row g-3">
      <div data-step="1" class="step-pane col-12">
        <label class="form-label">Full Name</label><input class="form-control" name="fullName" required>
        <label class="form-label mt-2">Email</label><input class="form-control" name="email" type="email" required>
        <label class="form-label mt-2">Phone</label><input class="form-control" name="phone" maxlength="10" required>
        <button class="btn btn-primary mt-3" type="button" id="next1">Next</button>
      </div>
      <div data-step="2" class="step-pane col-12 d-none">
        <label class="form-label">Password</label><input class="form-control" name="password" type="password" required>
        <label class="form-label mt-2">Confirm Password</label><input class="form-control" name="confirmPassword" type="password" required>
        <button class="btn btn-outline-primary mt-3" type="button" id="back1">Back</button>
        <button class="btn btn-primary mt-3" type="button" id="next2">Next</button>
      </div>
      <div data-step="3" class="step-pane col-12 d-none">
        <label class="form-label">Enter OTP</label><input class="form-control" name="otp" maxlength="6" required>
        <button class="btn btn-outline-primary mt-3" type="button" id="back2">Back</button>
        <button class="btn btn-primary mt-3" type="submit">Create Account</button>
      </div>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.APP_CONFIG={API_BASE_URL:'http://localhost:8000/api',GOOGLE_MAPS_API_KEY:''};</script>
<script src="/js/api-service.js"></script>
<script>
const panes=[...document.querySelectorAll('.step-pane')];
const pills=[document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3')];
const go=(step)=>{panes.forEach((p,i)=>p.classList.toggle('d-none',i!==step-1));pills.forEach((p,i)=>p.classList.toggle('active',i===step-1));};
document.getElementById('next1').onclick=()=>{
  const f=Object.fromEntries(new FormData(regForm).entries());
  if(!f.fullName || !FormValidator.validateEmail(f.email) || !FormValidator.validatePhone(f.phone)) return UIUtils.toast('Fill valid personal details','warning');
  go(2);
};
document.getElementById('back1').onclick=()=>go(1);
document.getElementById('next2').onclick=()=>{
  const f=Object.fromEntries(new FormData(regForm).entries());
  if(!FormValidator.validatePassword(f.password)) return UIUtils.toast('Password must be strong','warning');
  if(f.password!==f.confirmPassword) return UIUtils.toast('Passwords do not match','warning');
  go(3);
};
document.getElementById('back2').onclick=()=>go(2);
regForm.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(regForm).entries());
  if(!/^\d{6}$/.test(f.otp||'')) return UIUtils.toast('Enter valid OTP','warning');
  await apiService.register(f);
  UIUtils.toast('Registration successful');
  setTimeout(()=>location.href='/login.html',700);
});
</script>
</body>
</html>
