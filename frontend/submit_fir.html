<!DOCTYPE html>
<html lang="en">
<head>
  <title>Submit FIR</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net https://maps.googleapis.com https://maps.gstatic.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://maps.googleapis.com; connect-src 'self' http://localhost:8000 https://maps.googleapis.com;" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg main-nav"><div class="container"><a class="navbar-brand fw-bold" href="/index.html">Nyay Setu</a><div class="ms-auto"><a class="btn btn-outline-light" href="/track_fir.html">Track FIR</a></div></div></nav>
<main class="container py-4">
  <h2>Submit FIR</h2>
  <form id="firForm" class="row g-3">
    <div class="col-md-6"><label class="form-label">Incident Type</label><select class="form-select" name="incidentType" required><option value="">Select</option><option>Theft</option><option>Assault</option><option>Cyber Crime</option><option>Fraud</option></select></div>
    <div class="col-md-6"><label class="form-label">Priority</label><select class="form-select" name="priority" required><option>High</option><option selected>Medium</option><option>Low</option></select></div>
    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4" required></textarea></div>
    <div class="col-md-8"><label class="form-label">Incident Address</label><input class="form-control" id="addressInput" name="address" required></div>
    <div class="col-md-4 d-grid"><label class="form-label invisible">Detect</label><button class="btn btn-outline-primary" type="button" id="detectLocationBtn">Detect Location</button></div>
    <div class="col-12"><div id="firMap" class="map-container"></div></div>
    <div class="col-md-6"><label class="form-label">Nearest Police Station</label><select class="form-select" name="policeStation" id="stationSelect"><option>PS Gomti Nagar</option><option>PS Hazratganj</option><option>PS Indira Nagar</option></select></div>
    <div class="col-md-6"><label class="form-label">Evidence Upload</label><input class="form-control" type="file" name="evidence" multiple></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Submit FIR</button></div>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.APP_CONFIG={API_BASE_URL:'http://localhost:8000/api',GOOGLE_MAPS_API_KEY:''};</script>
<script src="/js/api-service.js"></script>
<script src="/js/maps-service.js"></script>
<script>
const mapsService=new MapsService();
let current={lat:28.6139,lng:77.2090};
mapsService.initializeMap('firMap',current);
mapsService.setupPlacesAutocomplete('addressInput',(loc)=>{current=loc;mapsService.initializeMap('firMap',loc);});
detectLocationBtn.onclick=async()=>{current=await mapsService.getUserLocation();mapsService.initializeMap('firMap',current);UIUtils.toast('Location detected');};
firForm.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target).entries());
  if(FormValidator.sanitize(f.description).length<10) return UIUtils.toast('Please provide detailed description','warning');
  const res=await apiService.submitFIR({...f,lat:current.lat,lng:current.lng});
  UIUtils.toast(`FIR submitted: ${res.fir.id}`);
  setTimeout(()=>location.href='/track_fir.html',700);
});
</script>
</body>
</html>
