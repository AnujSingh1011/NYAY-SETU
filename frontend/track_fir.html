<!DOCTYPE html>
<html lang="en">
<head>
  <title>Track FIR</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg main-nav"><div class="container"><a class="navbar-brand fw-bold" href="/index.html">Nyay Setu</a></div></nav>
<main class="container py-4">
  <h2>Track FIR Status</h2>
  <div class="row g-3">
    <div class="col-lg-4">
      <div class="table-card p-3">
        <label class="form-label">FIR Number</label>
        <input id="trackInput" class="form-control" placeholder="FIR-2026-0001">
        <button class="btn btn-primary mt-2 w-100" id="trackBtn">Track</button>
        <div id="trackSummary" class="alert-soft mt-3">Enter FIR number to view updates.</div>
      </div>
      <div class="table-card p-3 mt-3">
        <h5>Evidence</h5>
        <ul class="list-group"><li class="list-group-item">Site photo uploaded</li><li class="list-group-item">Witness statement attached</li></ul>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="table-card p-3">
        <h5>Investigation Timeline</h5>
        <div class="timeline">
          <div class="timeline-step done">Complaint Received</div>
          <div class="timeline-step done">FIR Registered</div>
          <div class="timeline-step active">Officer Assigned</div>
          <div class="timeline-step">Evidence Collection</div>
          <div class="timeline-step">Charge Sheet</div>
          <div class="timeline-step">Case Closure</div>
        </div>
        <h6>Officer Updates</h6>
        <ul class="list-group" id="updateList"></ul>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.APP_CONFIG={API_BASE_URL:'http://localhost:8000/api',GOOGLE_MAPS_API_KEY:''};</script>
<script src="/js/api-service.js"></script>
<script>
trackBtn.onclick=async()=>{
  const id=FormValidator.sanitize(trackInput.value||'FIR-2026-0001');
  const res=await apiService.getFIRById(id);
  if(!res.fir) return UIUtils.toast('FIR not found','warning');
  trackSummary.textContent=`${res.fir.id} • ${res.fir.title} • Status: ${res.fir.status}`;
  updateList.innerHTML=res.fir.updates.map(u=>`<li class='list-group-item'>${u}</li>`).join('');
};
trackBtn.click();
</script>
</body>
</html>
